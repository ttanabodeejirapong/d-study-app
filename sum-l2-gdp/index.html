<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D Study App</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033;display:grid;place-items:center;min-height:100vh}
.box{background:#fff;border:1px solid #dbe2ea;border-radius:16px;padding:22px;box-shadow:0 8px 28px rgba(23,54,93,.08)}
</style>
</head>
<body>
<div class="box"><b>Opening D Study App…</b><div style="margin-top:6px;color:#6b7280;font-size:13px">Loading the latest version from the main app.</div></div>
<script>
fetch("../index.html?ts="+Date.now(),{cache:"no-store"})
  .then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.text()})
  .then(h=>{document.open();document.write(h);document.close()})
  .catch(e=>{document.body.innerHTML='<div class="box"><b>Could not load the app.</b><div style="margin-top:8px">'+e+'</div></div>'});
</script>
</body>
</html>
